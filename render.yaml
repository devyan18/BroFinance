services:
  - type: web
    name: bro-finances-api
    runtime: docker
    # Render will auto-detect the Dockerfile in the repo root
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

      # Required — your MongoDB Atlas connection string
      # Format: mongodb+srv://<user>:<password>@<cluster>.mongodb.net/<dbname>
      - key: MONGODB_URI
        sync: false

      # Required — long random string used to sign JWT tokens
      # Render can generate one for you: click "Generate" in the dashboard
      - key: JWT_SECRET
        generateValue: true

      # Required — public URL of your frontend on Render
      # Example: https://bro-finances-app.onrender.com
      - key: CORS_ORIGIN
        sync: false

      # Optional — Google OAuth credentials
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # Required for avatar uploads — get from https://console.cloudinary.com
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Optional — email for forgot-password flow (nodemailer)
      # FRONTEND_URL es innecesario: el backend reutiliza CORS_ORIGIN para los links de reset-password
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false

